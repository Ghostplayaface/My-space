<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07080a">
  <title>?</title>
  <style>
    :root { color-scheme: dark; --violet:#a78bfa; --muted:#b9b6c6; }
    * { box-sizing: border-box; }
    html, body { margin:0; min-height:100%; background:#07080a; color:#f7f4ff; }
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow:hidden; }
    .bg { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; object-position:center; z-index:0;
      filter:brightness(.47) saturate(.82) contrast(1.08); transform:scale(1.025); }
    .shade { position:fixed; inset:0; z-index:1; pointer-events:none;
      background: radial-gradient(ellipse at center, rgba(7,8,10,.12) 0%, rgba(7,8,10,.35) 45%, rgba(4,4,8,.88) 100%),
      linear-gradient(120deg, rgba(80,50,130,.16), transparent 42%, rgba(25,60,42,.10)); }
    .scanlines { position:fixed; inset:0; z-index:3; pointer-events:none; opacity:.18;
      background: repeating-linear-gradient(to bottom, transparent 0px, transparent 3px, rgba(0,0,0,.42) 4px, transparent 5px); mix-blend-mode:soft-light; }
    .grain { position:fixed; inset:-50%; width:200%; height:200%; z-index:4; pointer-events:none; opacity:.075;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
      animation:grain .22s steps(2) infinite; }
    .content { position:relative; z-index:5; min-height:100svh; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:28px 20px 60px; text-align:center; animation:reveal 1.4s cubic-bezier(.2,.7,.2,1) both; }
    .eyebrow { color:#c5b4ff; font-size:10px; letter-spacing:.42em; text-transform:uppercase; margin-bottom:22px; text-shadow:0 0 18px #9b7cff77; }
    h1 { font-size:clamp(76px,16vw,144px); line-height:.9; letter-spacing:-.075em; margin:0; font-weight:800; text-shadow:0 0 14px #a78bfa44,0 0 42px #8b5cf655; position:relative; }
    h1::after { content:"?"; position:absolute; inset:0; color:#b4a0ff; opacity:.12; transform:translate(3px,0); clip-path:inset(42% 0 35% 0); animation:glitch 5s infinite; }
    .sub { color:var(--muted); margin:24px 0 34px; font-size:13px; letter-spacing:.16em; text-transform:lowercase; }
    .links { display:flex; flex-direction:column; gap:11px; width:min(100%,300px); }
    .link { display:flex; align-items:center; justify-content:center; gap:11px; min-height:52px; padding:14px 18px; color:#f4f0ff; text-decoration:none; font-size:12px; font-weight:650; letter-spacing:.19em; border:1px solid rgba(205,190,255,.25); border-radius:8px; background:rgba(10,9,17,.38); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); box-shadow:inset 0 0 24px rgba(167,139,250,.035); transition:transform .25s ease,border-color .25s ease,background .25s ease,box-shadow .25s ease; }
    .link:hover { transform:translateY(-3px); border-color:rgba(190,165,255,.78); background:rgba(81,55,125,.32); box-shadow:0 0 28px #8b5cf629; }
    .symbol { color:#c6b5ff; font-size:16px; }
    .sound { position:fixed; z-index:8; top:20px; right:20px; display:flex; align-items:center; gap:9px; padding:12px 14px; color:#f4f0ff; border:1px solid rgba(205,190,255,.35); border-radius:8px; background:rgba(10,9,17,.55); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); font:600 10px/1 system-ui,sans-serif; letter-spacing:.16em; cursor:pointer; transition:.25s ease; }
    .sound:hover { border-color:#b9a8ff; box-shadow:0 0 22px #8b5cf633; }
    .sound .icon { color:#c6b5ff; font-size:15px; }
    .bottom { position:fixed; z-index:6; bottom:19px; left:0; right:0; text-align:center; color:#ffffff69; font-size:9px; letter-spacing:.32em; }
    .rec { display:inline-block; margin-right:8px; width:6px; height:6px; border-radius:50%; background:#c4a7ff; box-shadow:0 0 10px #b49aff; animation:pulse 2s infinite; }
    @keyframes reveal { from { opacity:0; transform:translateY(12px); filter:blur(5px); } to { opacity:1; transform:none; filter:blur(0); } }
    @keyframes pulse { 50% { opacity:.35; } }
    @keyframes grain { 0% { transform:translate(0,0); } 25% { transform:translate(-1%,1%); } 50% { transform:translate(1%,-1%); } 75% { transform:translate(1%,1%); } }
    @keyframes glitch { 0%,92%,100% { transform:translate(3px,0); } 93% { transform:translate(-3px,1px); } 95% { transform:translate(2px,-1px); } 97% { transform:translate(-1px,0); } }
    @media (max-width:600px) { .bg { object-position:center; filter:brightness(.42) saturate(.82) contrast(1.06); } .sub { font-size:11px; letter-spacing:.1em; } .sound { top:12px; right:12px; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; transition:none!important; } }
  </style>
</head>
<body>
  <video id="bgVideo" class="bg" autoplay muted loop playsinline preload="metadata" aria-hidden="true">
    <source src="background.mp4" type="video/mp4">
  </video>
  <div class="shade"></div><div class="scanlines"></div><div class="grain"></div>
  <button class="sound" id="soundToggle" type="button" aria-pressed="false">
    <span class="icon" id="soundIcon">♫</span><span id="soundLabel">SOUND OFF</span>
  </button>
  <main class="content">
    <div class="eyebrow"><span class="rec"></span> signal detected // 001</div>
    <h1>?</h1>
    <p class="sub">lost somewhere between games &amp; music</p>
    <nav class="links" aria-label="Links">
      <a class="link" href="https://steamcommunity.com/id/kreedzplayer/" target="_blank" rel="noopener noreferrer"><span class="symbol">◈</span> STEAM PROFILE</a>
      <a class="link" href="https://music.youtube.com/playlist?list=PLijdG-cL9xwY6rbXs6AsAsMVi2E2kuuTq" target="_blank" rel="noopener noreferrer"><span class="symbol">♫</span> MY PLAYLIST</a>
    </nav>
  </main>
  <div class="bottom">NO SIGNAL / JUST VIBES</div>
  <script>
    const video = document.getElementById('bgVideo');
    const button = document.getElementById('soundToggle');
    const label = document.getElementById('soundLabel');
    const icon = document.getElementById('soundIcon');

    button.addEventListener('click', async () => {
      try {
        if (video.muted) {
          video.muted = false;
          video.volume = 0.7;
          await video.play();
          label.textContent = 'SOUND ON';
          icon.textContent = '♫';
          button.setAttribute('aria-pressed', 'true');
        } else {
          video.muted = true;
          label.textContent = 'SOUND OFF';
          icon.textContent = '♪';
          button.setAttribute('aria-pressed', 'false');
        }
      } catch (error) {
        video.muted = true;
        label.textContent = 'TAP AGAIN';
        button.setAttribute('aria-pressed', 'false');
      }
    });
  </script>
</body>
</html>
